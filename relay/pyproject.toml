[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
version = "0.1.0"
description = "Team relay: per-member mailboxes for questions and capability calls between Claude Code sessions"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "google-cloud-firestore==2.34.1",
    "google-auth==2.62.1",
    # Direct, not inherited: relay/auth.py builds google.auth.transport.requests.Request to
    # fetch Google's signing certificates, and that module imports requests by name.
    "requests==2.34.2",
    "jsonschema==4.26.0",
    # Teammate-published manifest patterns are evaluated only by RE2 (linear time; M1-SPEC
    # §11.1). Imported as `re2`; ships binary wheels (manylinux for the python:3.12 image).
    "google-re2==1.1.20251105",
    # Direct, not inherited: relay/oauth.py verifies the login's Google ID token (RS256 over
    # Google's JWKS) with it.
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    # The async tests use anyio's pytest plugin (asyncio backend only).
    "anyio==4.16.0",
    "ruff==0.17.4",
    # The tests drive the app through its ASGI transport.
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["relay"]

# M11-SPEC §5: the setup script GET /setup serves ships inside the package, and so does the
# sign-in page (docs/SIGNIN-PAGE.md): its template, stylesheet, fonts and the fonts' licences.
[tool.setuptools.package-data]
relay = [
    "static/*.sh",
    "static/welcome/*.html",
    "static/welcome/*.css",
    "static/welcome/fonts/*.woff2",
    "static/welcome/fonts/*.txt",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
